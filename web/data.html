<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dữ liệu · ViRDC LIVE</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">VR</span><span><strong>ViRDC Live</strong><small>Signal room</small></span></a><nav class="nav"><a href="/"><span class="nav-icon">⌂</span>Tổng quan</a><a href="/live"><span class="nav-icon">◉</span>Luồng bình luận</a><a href="/analytics"><span class="nav-icon">⌁</span>Phân tích</a><a class="active" href="/data"><span class="nav-icon">▦</span>Tra cứu dữ liệu</a></nav><div class="sidebar-foot">Dữ liệu đọc trực tiếp từ SQLite<br>Tối đa 10.000 dòng khi xuất CSV</div></aside>
<main class="main"><div class="signal-rail"></div><nav class="mobile-nav"><a href="/">Tổng quan</a><a href="/live">Bình luận</a><a href="/analytics">Phân tích</a><a class="active" href="/data">Dữ liệu</a></nav><header class="topbar"><div><div class="eyebrow">Kiểm tra và đối soát</div><h1 class="page-title">Tra cứu dữ liệu</h1></div><div class="live-pill" data-live-status><span class="live-dot"></span><span data-status-label>Đang chờ</span></div></header>
<div class="content"><div class="panel"><form class="toolbar" id="filters"><div class="field grow"><label for="data-search">Từ khóa</label><input id="data-search" name="search" type="search" placeholder="Nội dung hoặc tài khoản"></div><div class="field"><label for="data-label">Nhãn</label><select id="data-label" name="label"><option value="">Tất cả</option><option value="phân biệt">Phân biệt</option><option value="ủng hộ">Ủng hộ</option><option value="khác">Khác</option></select></div><div class="field"><label for="data-score">Confidence</label><select id="data-score" name="min_score"><option value="">Tất cả</option><option value="0.7">Từ 70%</option><option value="0.9">Từ 90%</option></select></div><button class="button" type="submit">Lọc dữ liệu</button><a class="button secondary" id="export" href="/api/export.csv">Xuất CSV</a></form>
<div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Tài khoản</th><th>Bình luận</th><th>Nhãn</th><th>Confidence</th><th>Latency</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><span id="page-info">0 kết quả</span><div><button class="button secondary" id="prev">← Trước</button> <button class="button secondary" id="next">Sau →</button></div></div></div></div>
</main></div><script src="/assets/common.js"></script><script src="/assets/data.js"></script></body></html>
